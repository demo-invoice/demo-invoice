name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
          # Fallback so a cache miss on first run (no lockfile yet) doesn't fail
        continue-on-error: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Provide a dummy value so Vite doesn't warn about missing env var during build
          VITE_SUPABASE_FUNCTIONS_URL: https://placeholder.supabase.co/functions/v1

      - name: Run tests
        run: npm test
