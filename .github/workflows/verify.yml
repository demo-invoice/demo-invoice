name: Verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check (src)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check (vite config)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
