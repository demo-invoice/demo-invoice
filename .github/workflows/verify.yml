name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Check font files (informational)
        run: node scripts/check-fonts.js || echo "WARNING: Font files missing — PDF branding will not work until TTFs are added to assets/fonts/"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
