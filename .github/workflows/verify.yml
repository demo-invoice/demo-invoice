name: verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - run: npm install

      - run: npm test

      - run: npx tsc -p tsconfig.json --noEmit

      - run: npx tsc -p tsconfig.node.json --noEmit

      - run: npm run build
